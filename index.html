<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interest Rate Calculator</title>
  <meta name="description" content="Calculate simple interest and total amount based on principal, interest rate, and time.">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>Interest Rate Calculator</h1>
    <p>Calculate your simple interest and total amount.</p>

    <form id="calculator-form">
      <label for="principal">Principal Amount</label>
      <input type="number" id="principal" min="0" step="any" required>

      <label for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" min="0" step="any" required>

      <label for="years">Time (Years)</label>
      <input type="number" id="years" min="0" step="any" required>

      <button type="submit">Calculate Interest</button>
    </form>

    <section id="result" aria-live="polite">
      <p>Enter your values to calculate interest.</p>
    </section>
  </main>
</body>
</html>
